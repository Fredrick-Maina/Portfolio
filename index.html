<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred | Cyber Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="style.css?v=2.0.9">
</head>
<body>
    <div class="container">
        <header class="terminal-header">
            <div class="terminal-title">Terminal Portfolio v2.0.9 <span id="live-clock" style="margin-left: 15px; font-weight: normal; opacity: 0.8;"></span></div>
            <div class="terminal-controls" aria-hidden="true">
                <div class="control"></div>
                <div class="control"></div>
                <div class="control"></div>
            </div>
        </header>
        
        <main id="terminal-wrapper" class="terminal-wrapper">
            <div id="terminal-screen" class="terminal" role="log" aria-live="polite"></div>
            <!-- Input line will be dynamically managed -->
        </main>

        <nav class="quick-commands" aria-label="Quick commands">
            <button type="button" data-cmd="help">help</button>
            <button type="button" data-cmd="about">about</button>
            <button type="button" data-cmd="projects">projects</button>
            <button type="button" data-cmd="writeups">writeups</button>
            <button type="button" data-cmd="vulnerabilities">vulns</button>
            <button type="button" data-cmd="reports">reports</button>
            <button type="button" data-cmd="certs">certs</button>
            <button type="button" data-cmd="resume">resume</button>
            <button type="button" data-cmd="contact">contact</button>
            <button type="button" data-cmd="clear">clear</button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="js/commands.js?v=2.0.9"></script>
    <script src="js/typing.js?v=2.0.9"></script>
    <script src="js/terminal.js?v=2.0.9"></script>
    <script src="script.js?v=2.0.9"></script>
</body>
</html>
